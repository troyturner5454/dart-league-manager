<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline - CR Wed Darts</title>
  <style>
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0f172a; color:#fff; font-family:Arial,Helvetica,sans-serif; text-align:center; padding:24px; }
    .card { max-width:360px; background:#1e293b; border-radius:24px; padding:32px; }
    h1 { margin:8px 0; font-size:24px; }
    p { color:#94a3b8; }
    button { margin-top:16px; width:100%; border:0; border-radius:12px; padding:14px;
             background:#2563eb; color:#fff; font-size:18px; font-weight:bold; }
  </style>
</head>
<body>
  <div class="card">
    <div style="font-size:56px">&#127919;</div>
    <h1>You're offline</h1>
    <p>CR Wed Darts needs a connection to load and save stats. Check your signal and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
